# Template only — do NOT commit a real key.
#
# Generate one and create the Secret out of band:
#
#   kubectl create secret generic whatsapp-go \
#     --from-literal=api-key="wa_$(openssl rand -hex 24)"
#
# The server refuses every request when no key is configured, and a key it
# generates itself is ephemeral (it is never written back to disk), so the
# Secret is the only way to get a stable credential across restarts.
apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-go
  labels:
    app.kubernetes.io/name: whatsapp-go
type: Opaque
stringData:
  api-key: "REPLACE_ME"
