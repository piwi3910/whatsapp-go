name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref: nothing here needs to finish for an
# older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth: the toolchain line in go.mod.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # -race is the point of this job: the server has background goroutines
      # (connection supervisor, pruners, signal handler) touching shared
      # state, and those bugs do not reproduce reliably without it.
      - name: test
        run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only — publishing is a separate, credentialed workflow. This
      # catches a broken Dockerfile before it reaches a release.
      - name: build image
        run: docker build --build-arg VERSION="${GITHUB_SHA::7}" -t whatsapp-go:ci .
